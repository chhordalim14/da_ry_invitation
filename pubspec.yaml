name: da_ry_invitation
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.12.0
  video_player: ^2.10.1
  just_audio: ^0.10.5
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/wedding/
    - assets/audio/
 
  fonts:
    - family: Moulpali
      fonts:
        - asset: assets/font/Moulpali-Regular.ttf
          weight: 600
    - family: KantumruyPro
      fonts:
        - asset: assets/font/KantumruyPro-Regular.ttf
          weight: 600
    - family: IMFellEnglishSC
      fonts:
        - asset: assets/font/IMFellEnglishSC-Regular.ttf
          weight: 600

# Configuration for flutter_launcher_icons must be TOP LEVEL, not under flutter:
flutter_icons:
  android: true
  ios: true
  image_path: "assets/wedding_name.png"
  web:
    generate: true
    image_path: "assets/wedding_name.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"